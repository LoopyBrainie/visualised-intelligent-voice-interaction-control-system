[package]
name = "visualised-intelligent-voice-interaction-control-system"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "visualised_intelligent_voice_interaction_control_system_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
cpal = "0.17.3"
pyo3 = { version = "0.28.3", features = ["auto-initialize"] }
numpy = "0.28.0"
tokio = { version = "1.52.1", features = ["sync", "rt"] }
futures = "0.3"
anyhow = "1.0.102"
once_cell = "1.19"
lazy_static = "1.4.0"
regex = "1"
rustfft = "6.4.1"
strsim = "0.11.1"
thiserror = "2.0.18"
reqwest = { version = "0.13.3", features = ["json", "blocking"] }
base64 = "0.22.1"
uuid = { version = "1.23.1", features = ["v4"] }

title: "可视化智能语音交互控制系统 — 设计报告"
author: "林珏文"
lang: zh-CN
date: 2026-05-08
abstract: |
  本项目来源于电子信息科学与技术专业中级项目课，课题名称为"可视化智能语音交互控制系统设计与实现"。
  课程为期 8 周，要求完成一套融合语音信号采集、指令解析、设备状态控制、可视化建模、多线程并发的智能家居仿真控制系统。
keywords:
  - 语音交互
  - 智能家居
  - FFT
  - VLM
  - Tauri
  - SolidJS
  - 液态玻璃 UI

